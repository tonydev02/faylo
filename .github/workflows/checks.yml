name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Test, lint, typecheck, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
  database:
    name: PostgreSQL and RLS integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.122.1
      - name: Start local Supabase
        run: supabase start
      - name: Apply migrations to a clean local database
        run: supabase db reset --local
      - name: Verify historical FX migration upgrade
        run: npm run test:db:upgrade
      - name: Run PostgreSQL and RLS integration tests
        run: npm run test:db
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run authenticated browser smoke test
        run: npm run test:browser
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
